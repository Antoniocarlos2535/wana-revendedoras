<style>
  :root{
    --bg:#1a1410;
    --surface:#231b16;
    --surface-2:#2c2119;
    --gold:#c9a24b;
    --gold-soft:#e3c67a;
    --copper:#a8592e;
    --cream:#f4ede0;
    --muted:#a89684;
    --line:rgba(244,237,224,0.12);
    --good:#7a9a6f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Jost',sans-serif;
    font-weight:300;
    line-height:1.6;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    letter-spacing:0.01em;
  }
  .eyebrow{
    font-family:'Jost',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.22em;
    font-size:12px;
    color:var(--gold);
    font-weight:500;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  a{color:inherit;text-decoration:none;}

  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--gold);
    padding:14px 20px;
    text-align:center;
    font-family:'Jost',sans-serif;
    font-weight:600;
    color:#1a1410;
    letter-spacing:0.02em;
    box-shadow:0 -8px 24px rgba(0,0,0,0.35);
  }
  .sticky-cta svg{vertical-align:-3px;margin-right:6px;}

  .hero{
    position:relative;
    padding:64px 0 72px;
    background:
      radial-gradient(ellipse 900px 500px at 85% -10%, rgba(201,162,75,0.16), transparent 60%),
      radial-gradient(ellipse 700px 400px at 5% 110%, rgba(168,89,46,0.14), transparent 60%),
      var(--bg);
    border-bottom:1px solid var(--line);
  }
  .brandmark{
    display:flex;align-items:center;gap:10px;margin-bottom:48px;
  }
  .brandmark .ring{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--gold);
  }
  .brandmark .name{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:0.06em;}
  .brandmark .name b{color:var(--gold);font-weight:600;}

  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  .hero h1{font-size:clamp(34px,5vw,54px);line-height:1.08;margin:14px 0 20px;}
  .hero h1 em{font-style:italic;color:var(--gold-soft);}
  .hero p.lead{font-size:17px;color:var(--muted);max-width:46ch;margin-bottom:32px;}

  .cta-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--gold);
    color:#1a1410;
    font-family:'Jost',sans-serif;font-weight:600;font-size:15px;
    padding:16px 28px;border-radius:4px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow:0 10px 30px rgba(201,162,75,0.18);
  }
  .cta-btn:hover{background:var(--gold-soft);transform:translateY(-1px);}
  .cta-sub{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:0.02em;}

  .kit-card{
    background:linear-gradient(160deg,var(--surface),var(--surface-2));
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px;
    position:relative;
  }
  .kit-card .tag{
    position:absolute;top:-12px;right:20px;
    background:var(--good);color:#0f1a0e;
    font-size:11px;font-weight:600;letter-spacing:0.04em;
    padding:5px 12px;border-radius:3px;text-transform:uppercase;
  }
  .kit-card .kit-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;margin-bottom:18px;}
  .kit-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line);}
  .kit-row:last-of-type{border-bottom:none;}
  .kit-row .label{font-size:14px;color:var(--cream);}
  .kit-row .value{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold-soft);}
  .kit-total{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .kit-total .label{font-size:14px;color:var(--muted);}
  .kit-total .value{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);}

  .benefits{padding:80px 0;}
  .section-head{text-align:center;max-width:560px;margin:0 auto 48px;}
  .section-head h2{font-size:clamp(28px,3.6vw,38px);margin-top:10px;}
  .benefit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .benefit{background:var(--bg);padding:32px 24px;}
  .benefit .icon{width:36px;height:36px;margin-bottom:16px;color:var(--gold);}
  .benefit h3{font-size:20px;margin-bottom:8px;color:var(--cream);}
  .benefit p{font-size:13.5px;color:var(--muted);}

  .commission{padding:80px 0;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
